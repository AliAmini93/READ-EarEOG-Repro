[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "read-eareog"
version = "0.1.0"
description = "Detection of return-sweep-like saccades from ear-electrode recordings during reading (article code)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ali Amini"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]   # GitHub source release only; not on PyPI

[project.urls]
Repository = "https://github.com/AliAmini93/READ-EarEOG-Repro"

[project.optional-dependencies]
labelfree = ["scikit-learn>=1.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
